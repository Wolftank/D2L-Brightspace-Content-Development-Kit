<!DOCTYPE html>
<!-- a11y/form-label passes: one field labelled with for/id, one wrapped in its label. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cell division practice</title>
</head>
<body>
<h1>Cell division practice</h1>
<p><label for="cells">How many cells after mitosis?</label>
<input type="number" id="cells"></p>
<p><label>Your name <input type="text"></label></p>
</body>
</html>
