name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  front-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: front-end
      - run: npm run lint
        working-directory: front-end
      - run: npm run typecheck
        working-directory: front-end
      - run: npm test
        working-directory: front-end

  back-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: back-end
      - run: npm run lint
        working-directory: back-end
      - run: npm run typecheck
        working-directory: back-end
      - run: npm test
        working-directory: back-end

  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kit QA gate tests (lint.test.js)
        run: node harness/lint/lint.test.js
        working-directory: back-end/kit
      - name: Kit emulator tests (emulator.test.js)
        if: success() || failure()
        run: node harness/emulator.test.js
        working-directory: back-end/kit
      - name: Kit routing tests (routing.test.js)
        if: success() || failure()
        run: node builds/cdk/routing.test.js
        working-directory: back-end/kit
