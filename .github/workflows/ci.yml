name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  front-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        working-directory: front-end

  back-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        working-directory: back-end

  # Add a job here that runs back-end/kit/harness/lint/lint.js against
  # anything in back-end/ that touches D2L build/deploy — that script is
  # the tenant-specific QA gate.
