name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  front-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
        working-directory: front-end
      - run: npm run typecheck
        working-directory: front-end
      - run: npm test
        working-directory: front-end

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
        working-directory: front-end
      - run: npm run test:e2e
        working-directory: front-end
        env:
          CI: true
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            front-end/playwright-report/
            front-end/test-results/
          retention-days: 7

  back-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
        working-directory: back-end
      - run: npm run typecheck
        working-directory: back-end
      - run: npm test
        working-directory: back-end

  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kit QA gate tests (lint.test.js)
        run: node harness/lint/lint.test.js
        working-directory: back-end/kit
      - name: Kit emulator tests (emulator.test.js)
        if: success() || failure()
        run: node harness/emulator.test.js
        working-directory: back-end/kit
      - name: Kit routing tests (routing.test.js)
        if: success() || failure()
        run: node builds/cdk/routing.test.js
        working-directory: back-end/kit
